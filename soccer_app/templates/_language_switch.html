{% load i18n %}
{% get_current_language as CURRENT_LANGUAGE %}
{% get_available_languages as AVAILABLE_LANGUAGES %}
{% get_language_info_list for AVAILABLE_LANGUAGES as languages %}
<form action="{% url 'set_language' %}" method="post" class="d-flex align-items-center ms-lg-2 mt-2 mt-lg-0">
  {% csrf_token %}
  <input name="next" type="hidden" value="{{ request.get_full_path }}">
  <label class="visually-hidden" for="language-select">{% trans "Language" %}</label>
  <select id="language-select" name="language" class="form-select form-select-sm w-auto"
          onchange="this.form.submit()" aria-label="{% trans 'Language' %}">
    {% for language in languages %}
      <option value="{{ language.code }}" {% if language.code == CURRENT_LANGUAGE %}selected{% endif %}>
        {{ language.name_local }}
      </option>
    {% endfor %}
  </select>
</form>
